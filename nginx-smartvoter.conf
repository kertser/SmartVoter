# SmartVoter — nginx virtual host
# Place this file in your nginx sites-available and symlink to sites-enabled,
# OR mount it into the tdg-nginx container as /etc/nginx/conf.d/smartvoter.conf
#
# After adding, obtain SSL certificate:
#   sudo certbot --nginx -d smartvoter.alpha-numerical.com
# OR if using the Docker nginx container:
#   docker exec tdg-nginx certbot --nginx -d smartvoter.alpha-numerical.com

server {
    listen 80;
    server_name smartvoter.alpha-numerical.com;

    # Redirect all HTTP to HTTPS (certbot will manage this block after --nginx)
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name smartvoter.alpha-numerical.com;

    # --- SSL (certbot will fill these in automatically) ---
    # ssl_certificate     /etc/letsencrypt/live/smartvoter.alpha-numerical.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/smartvoter.alpha-numerical.com/privkey.pem;
    # include             /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Backend API — /api/* and /health → FastAPI on host port 8001
    location /api/ {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
    }

    # Frontend — everything else → Next.js on host port 3000
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

