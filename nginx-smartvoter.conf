################################################################################
# nginx.conf — reverse proxy for KShU / TDG + SmartVoter
################################################################################

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── Upstream: FastAPI backend (TDG) ─────────────────────────────────────
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    # ── TDG: HTTP on port 80 ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        client_max_body_size 50M;

        location /ws/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location ~* \.(js|css)$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location ~* \.(png|svg|ico|woff2?)$ {
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
        }
    }

    # ── SmartVoter: HTTP → HTTPS redirect ───────────────────────────────────
    server {
        listen 80;
        server_name smartvoter.alpha-numerical.com;
        return 301 https://$host$request_uri;
    }

    # ── SmartVoter: HTTPS ────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name smartvoter.alpha-numerical.com;

        ssl_certificate     /etc/letsencrypt/live/smartvoter.alpha-numerical.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/smartvoter.alpha-numerical.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        client_max_body_size 10M;

        location /api/ {
            proxy_pass         http://172.17.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /health {
            proxy_pass http://172.17.0.1:8001;
            proxy_set_header Host $host;
        }

        location /docs {
            proxy_pass http://172.17.0.1:8001;
            proxy_set_header Host $host;
        }

        location /_next/webpack-hmr {
            proxy_pass         http://172.17.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
        }

        location / {
            proxy_pass         http://172.17.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 120s;
        }
    }
}
