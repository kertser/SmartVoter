services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: smartvoter
      POSTGRES_PASSWORD: smartvoter
      POSTGRES_DB: smartvoter
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartvoter -d smartvoter"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uv run uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://smartvoter:smartvoter@postgres:5432/smartvoter
      REDIS_URL: redis://redis:6379/0
      # Override any VIRTUAL_ENV that env_file might inject from a host .env
      VIRTUAL_ENV: /app/.venv
      UV_PROJECT_ENVIRONMENT: /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      backend:
        condition: service_healthy

  # ── Data initialisation service ───────────────────────────────────────────
  # Opt-in via Docker profile "init".
  #
  # Run ONCE before going live, or after elections:
  #   docker compose --profile init up data-init
  #
  # What it does:
  #   1. Applies DB migrations (alembic upgrade head)
  #   2. Seeds mock data (topics, questions, simulation data)
  #   3. Imports real Knesset data for the last 2 Knessets (no LLM)
  #      — Bills + factions + persons for all Knessets
  #      — Votes + vote results only for Knessets ≤ LAST_KNESSET_WITH_VOTES (24)
  #   4. Runs analysis pipeline: policy items, party positions, lineage, volatility
  #
  # LLM enrichment is OFF by default (no API key needed). Enable it separately
  # from the Admin panel once the API key is configured.
  #
  # Override LAST_N_KNESSETS to import more history (e.g. 4 = K22–K25).
  data-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: >
      sh -c "
        echo '=== SmartVoter Data Initialisation ===' &&
        echo '1/3 Applying database migrations...' &&
        uv run alembic upgrade head &&
        echo '2/3 Seeding mock data...' &&
        uv run python -m backend.app.seed.run_seed &&
        echo '3/3 Importing Knesset data (last $$LAST_N_KNESSETS Knessets, no LLM)...' &&
        uv run python -m backend.app.seed.ingest_knesset
          --last-n $$LAST_N_KNESSETS
          --no-llm &&
        echo '=== Initialisation complete ==='
      "
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://smartvoter:smartvoter@postgres:5432/smartvoter
      REDIS_URL: redis://redis:6379/0
      LAST_N_KNESSETS: ${LAST_N_KNESSETS:-2}
      # Override any VIRTUAL_ENV that env_file might inject from a host .env
      VIRTUAL_ENV: /app/.venv
      UV_PROJECT_ENVIRONMENT: /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - init
    restart: "no"

volumes:
  postgres_data:
